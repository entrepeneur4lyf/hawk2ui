[workspace]
resolver = "3"
members = [
    "crates/hawk2ui-a11y",
    "crates/hawk2ui-api",
    "crates/hawk2ui-assets",
    "crates/hawk2ui-authoring",
    "crates/hawk2ui-build",
    "crates/hawk2ui-compat",
    "crates/hawk2ui-conformance",
    "crates/hawk2ui-core",
    "crates/hawk2ui-framework-conformance",
    "crates/hawk2ui-framework-react",
    "crates/hawk2ui-framework-solid",
    "crates/hawk2ui-framework-svelte",
    "crates/hawk2ui-framework-vue",
    "crates/hawk2ui-host",
    "crates/hawk2ui-host-baseview",
    "crates/hawk2ui-host-winit",
    "crates/hawk2ui-layout",
    "crates/hawk2ui-perf",
    "crates/hawk2ui-platform",
    "crates/hawk2ui-plugin",
    "crates/hawk2ui-plugin-adapters",
    "crates/hawk2ui-plugin-truce",
    "crates/hawk2ui-vst3",
    "crates/hawk2ui-render",
    "crates/hawk2ui-render-skia",
    "crates/hawk2ui-runtime",
    "crates/hawk2ui-schema",
    "crates/hawk2ui-script",
    "crates/hawk2ui-security",
    "crates/hawk2ui-security-model",
    "crates/hawk2ui-smoke",
    "crates/hawk2ui-style",
    "crates/hawk2ui-testkit",
    "crates/hawk2ui-text",
    "crates/hawk2ui-cli",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Shawn <shawn@hawk2ui.com>", "Claude Opus 4.8 <noreply@anthropic.com>"]
homepage = "https://hawk2ui.com"
repository = "https://github.com/entrepeneur4lyf/hawk2ui"
description = "Production native UI framework for desktop applications and embeddable plugin editors."

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
ed25519-dalek = "2.2.0"
notify = "8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
url = "2"
