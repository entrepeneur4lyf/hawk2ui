[package]
name = "hawk2ui-render-skia"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Skia-backed production renderer backend for Hawk2UI."

[lib]
name = "hawk2ui_render_skia"
path = "src/lib.rs"

[dependencies]
hawk2ui-assets = { version = "0.1.0", path = "../hawk2ui-assets" }
hawk2ui-render = { version = "0.1.0", path = "../hawk2ui-render" }
hawk2ui-runtime = { version = "0.1.0", path = "../hawk2ui-runtime" }
hawk2ui-text = { version = "0.1.0", path = "../hawk2ui-text" }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
skia-safe = { version = "0.97.2", features = ["binary-cache", "gl"] }

[dev-dependencies]
hawk2ui-layout = { version = "0.1.0", path = "../hawk2ui-layout" }

[lints]
workspace = true
