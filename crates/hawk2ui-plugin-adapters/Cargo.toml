[package]
name = "hawk2ui-plugin-adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Production plugin and package adapters for Hawk2UI CLAP, VST3, AU, standalone, and desktop outputs."

[lib]
name = "hawk2ui_plugin_adapters"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
clap-sys = "0.5.0"
hawk2ui-build = { version = "0.1.0", path = "../hawk2ui-build" }
hawk2ui-host = { version = "0.1.0", path = "../hawk2ui-host" }
hawk2ui-plugin = { version = "0.1.0", path = "../hawk2ui-plugin" }
hawk2ui-runtime = { version = "0.1.0", path = "../hawk2ui-runtime" }
hawk2ui-vst3 = { version = "0.1.0", path = "../hawk2ui-vst3" }
jsonschema = { version = "0.46.5", default-features = false }
schemars = "1.2.1"
serde.workspace = true
serde_json = "1"
sha2.workspace = true
toml.workspace = true
