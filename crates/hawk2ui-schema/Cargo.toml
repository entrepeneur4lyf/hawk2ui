[package]
name = "hawk2ui-schema"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared typed schema records for Hawk2UI products, manifests, artifacts, capabilities, and diagnostics."

[lib]
name = "hawk2ui_schema"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
hawk2ui-api = { version = "0.1.0", path = "../hawk2ui-api" }
hawk2ui-build = { version = "0.1.0", path = "../hawk2ui-build" }
hawk2ui-platform = { version = "0.1.0", path = "../hawk2ui-platform" }
hawk2ui-plugin = { version = "0.1.0", path = "../hawk2ui-plugin" }
hawk2ui-plugin-adapters = { version = "0.1.0", path = "../hawk2ui-plugin-adapters" }
jsonschema = { version = "0.46.5", default-features = false }
schemars = "1.2.1"
serde.workspace = true
serde_json = "1"
