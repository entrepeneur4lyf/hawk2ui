[package]
name = "hawk2ui-js-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Deno-core JavaScript runtime and Hawk2UI native capability bridge."

[lib]
name = "hawk2ui_js_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
deno_core = "0.403.0"
deno_error = "0.7.1"
getrandom = "0.3"
hawk2ui-layout = { version = "0.1.0", path = "../hawk2ui-layout" }
hawk2ui-render = { version = "0.1.0", path = "../hawk2ui-render" }
hawk2ui-runtime = { version = "0.1.0", path = "../hawk2ui-runtime" }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
hawk2ui-render-skia = { version = "0.1.0", path = "../hawk2ui-render-skia" }
