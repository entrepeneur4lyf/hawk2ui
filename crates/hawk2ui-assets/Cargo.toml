[package]
name = "hawk2ui-assets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Production asset decoding, validation, lowering, hashing, and cache invalidation for Hawk2UI."

[lib]
name = "hawk2ui_assets"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
fontdb = "0.23.0"
hawk2ui-api = { version = "0.1.0", path = "../hawk2ui-api" }
hawk2ui-render = { version = "0.1.0", path = "../hawk2ui-render" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }
sha2 = "0.11.0"
usvg = "0.47.0"
