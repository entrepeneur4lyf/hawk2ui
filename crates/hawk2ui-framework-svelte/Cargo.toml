[package]
name = "hawk2ui-framework-svelte"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Svelte 5 integration for emitting Hawk2UI typed records."

[lib]
name = "hawk2ui_framework_svelte"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
hawk2ui-authoring = { version = "0.1.0", path = "../hawk2ui-authoring" }
hawk2ui-runtime = { version = "0.1.0", path = "../hawk2ui-runtime" }
hawk2ui-style = { version = "0.1.0", path = "../hawk2ui-style" }

[dev-dependencies]
hawk2ui-layout = { version = "0.1.0", path = "../hawk2ui-layout" }
hawk2ui-render = { version = "0.1.0", path = "../hawk2ui-render" }
hawk2ui-render-skia = { version = "0.1.0", path = "../hawk2ui-render-skia" }
