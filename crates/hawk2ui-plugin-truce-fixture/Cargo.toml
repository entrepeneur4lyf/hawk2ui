[package]
name = "hawk2ui-plugin-truce-fixture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Conformance fixture proving truce::plugin! export composition with the Hawk2UI truce editor."

[lib]
name = "hawk2ui_plugin_truce_fixture"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
# The umbrella crate supplies the `truce::plugin!` export macro, the
# `PluginLogic` trait, and `#[derive(Params)]`. `default-features = false`
# keeps the per-format SDK wrappers out: this fixture proves the editor
# composition seam without linking CLAP/VST3/AU SDK wrappers.
truce = { version = "0.49.14", default-features = false }
truce-core = "0.49.14"
hawk2ui-host = { version = "0.1.0", path = "../hawk2ui-host" }
hawk2ui-plugin-truce = { version = "0.1.0", path = "../hawk2ui-plugin-truce" }
