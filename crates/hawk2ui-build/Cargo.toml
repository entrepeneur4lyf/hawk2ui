[package]
name = "hawk2ui-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Manifest validation, build pipeline orchestration, sealed artifacts, package metadata, and verification reports for Hawk2UI."

[lib]
name = "hawk2ui_build"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ed25519-dalek.workspace = true
hawk2ui-api = { version = "0.1.0", path = "../hawk2ui-api" }
hawk2ui-assets = { version = "0.1.0", path = "../hawk2ui-assets" }
hawk2ui-plugin = { version = "0.1.0", path = "../hawk2ui-plugin" }
hawk2ui-script = { version = "0.1.0", path = "../hawk2ui-script" }
hawk2ui-style = { version = "0.1.0", path = "../hawk2ui-style" }
jsonschema = { version = "0.46.5", default-features = false }
schemars = "1.2.1"
serde.workspace = true
serde_json = "1"
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Test-only: the param emitter produces truce `#[derive(Params)]` source as
# text (no `truce` dependency in the crate itself). `tests/param_codegen.rs`
# compiles a checked-in golden against truce and drives it through
# `for_test_params`, which needs the umbrella crate (for `::truce::` paths) and
# `truce-core` (for the test bridge). `default-features = false` keeps the
# format/SDK wrappers out.
truce = { version = "0.49.14", default-features = false }
truce-core = "0.49.14"
