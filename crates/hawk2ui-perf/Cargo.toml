[package]
name = "hawk2ui-perf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Performance budgets, benchmark helpers, and stability gates for Hawk2UI."
autobenches = false

[lib]
name = "hawk2ui_perf"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true

[dev-dependencies]
hawk2ui-build = { version = "0.1.0", path = "../hawk2ui-build" }
hawk2ui-layout = { version = "0.1.0", path = "../hawk2ui-layout" }
hawk2ui-render = { version = "0.1.0", path = "../hawk2ui-render" }
hawk2ui-runtime = { version = "0.1.0", path = "../hawk2ui-runtime" }
hawk2ui-smoke = { version = "0.1.0", path = "../hawk2ui-smoke" }

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "style"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "script"
harness = false

[[bench]]
name = "assets"
harness = false

[[bench]]
name = "render_baseline"
harness = false

[[bench]]
name = "release_gates"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "package"
