[package]
name = "hawk2ui-script"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Production script backend for Hawk2UI JavaScript and TypeScript execution."

[lib]
name = "hawk2ui_script"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
boa_engine = "0.21.1"
hawk2ui-api = { version = "0.1.0", path = "../hawk2ui-api" }
oxc_allocator = "0.133.0"
oxc_codegen = "0.133.0"
oxc_parser = "0.133.0"
oxc_semantic = "0.133.0"
oxc_span = "0.133.0"
oxc_transformer = "0.133.0"
# Serializes the editor host snapshot (params/meters) into a JSON literal
# embedded in the entry-script bootstrap — a valid, injection-safe JS expression
# (author-controlled param names/text get executed as JS, so escaping must be
# correct). Standard, already in the lock tree, deny-clean.
serde = { workspace = true }
serde_json = "1"
