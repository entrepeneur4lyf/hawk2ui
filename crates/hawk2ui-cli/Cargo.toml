[package]
name = "hawk2ui-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Command-line interface for Hawk2UI validation, builds, runs, packaging, and diagnostics."
default-run = "hawk2ui-cli"

[[bin]]
name = "hawk2ui-cli"
path = "src/main.rs"

[[bin]]
name = "hawk2ui-packaged-desktop"
path = "src/packaged_desktop_main.rs"

[lib]
name = "hawk2ui_cli"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
hawk2ui-api = { version = "0.1.0", path = "../hawk2ui-api" }
hawk2ui-authoring = { version = "0.1.0", path = "../hawk2ui-authoring" }
hawk2ui-assets = { version = "0.1.0", path = "../hawk2ui-assets" }
hawk2ui-build = { version = "0.1.0", path = "../hawk2ui-build" }
hawk2ui-host = { version = "0.1.0", path = "../hawk2ui-host" }
hawk2ui-host-winit = { version = "0.1.0", path = "../hawk2ui-host-winit" }
hawk2ui-layout = { version = "0.1.0", path = "../hawk2ui-layout" }
hawk2ui-plugin = { version = "0.1.0", path = "../hawk2ui-plugin" }
hawk2ui-plugin-adapters = { version = "0.1.0", path = "../hawk2ui-plugin-adapters" }
hawk2ui-render = { version = "0.1.0", path = "../hawk2ui-render" }
hawk2ui-runtime = { version = "0.1.0", path = "../hawk2ui-runtime" }
hawk2ui-schema = { version = "0.1.0", path = "../hawk2ui-schema" }
hawk2ui-script = { version = "0.1.0", path = "../hawk2ui-script" }
hawk2ui-security-model = { version = "0.1.0", path = "../hawk2ui-security-model" }
notify.workspace = true
richrs = "0.2.1"
serde.workspace = true
serde_json = "1"
