[package]
name = "hawk2ui-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Command-line interface for Hawk2UI validation, builds, runs, packaging, and diagnostics."

[[bin]]
name = "hawk2ui-cli"
path = "src/main.rs"

[lib]
name = "hawk2ui_cli"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
hawk2ui-build = { version = "0.1.0", path = "../hawk2ui-build" }
hawk2ui-plugin = { version = "0.1.0", path = "../hawk2ui-plugin" }
hawk2ui-plugin-adapters = { version = "0.1.0", path = "../hawk2ui-plugin-adapters" }
serde.workspace = true
