[package]
name = "hawk2ui-host-baseview"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Baseview-backed embedded plugin host adapter for Hawk2UI."

[lib]
name = "hawk2ui_host_baseview"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
baseview = "0.1.1"
hawk2ui-host = { version = "0.1.0", path = "../hawk2ui-host" }
hawk2ui-layout = { version = "0.1.0", path = "../hawk2ui-layout" }
hawk2ui-render = { version = "0.1.0", path = "../hawk2ui-render" }
hawk2ui-render-skia = { version = "0.1.0", path = "../hawk2ui-render-skia" }
hawk2ui-runtime = { version = "0.1.0", path = "../hawk2ui-runtime" }
keyboard-types = "0.6.2"
raw-window-handle = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"

[dev-dependencies]
hawk2ui-build = { version = "0.1.0", path = "../hawk2ui-build" }
hawk2ui-plugin = { version = "0.1.0", path = "../hawk2ui-plugin" }
hawk2ui-plugin-adapters = { version = "0.1.0", path = "../hawk2ui-plugin-adapters" }
serde_json = "1"
