[package]
name = "hawk2ui-host-winit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Winit-backed desktop host adapter for Hawk2UI."

[lib]
name = "hawk2ui_host_winit"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
arboard = "3.6.1"
hawk2ui-api = { version = "0.1.0", path = "../hawk2ui-api" }
hawk2ui-assets = { version = "0.1.0", path = "../hawk2ui-assets" }
hawk2ui-host = { version = "0.1.0", path = "../hawk2ui-host" }
hawk2ui-layout = { version = "0.1.0", path = "../hawk2ui-layout" }
hawk2ui-render = { version = "0.1.0", path = "../hawk2ui-render" }
hawk2ui-render-skia = { version = "0.1.0", path = "../hawk2ui-render-skia" }
hawk2ui-runtime = { version = "0.1.0", path = "../hawk2ui-runtime" }
skia-safe = { version = "0.97.0", default-features = false, features = ["binary-cache"] }
softbuffer = "0.4.8"
winit = "0.30.12"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
