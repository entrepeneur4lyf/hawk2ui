[package]
name = "hawk2ui-plugin-truce"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Truce audio-plugin framework binding for Hawk2UI: renders the Hawk2UI editor into a truce plugin through truce's Editor seam."

[lib]
name = "hawk2ui_plugin_truce"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
truce-core = "0.49.14"
truce-params = "0.49.14"
hawk2ui-host = { version = "0.1.0", path = "../hawk2ui-host" }
hawk2ui-host-baseview = { version = "0.1.0", path = "../hawk2ui-host-baseview" }
hawk2ui-layout = { version = "0.1.0", path = "../hawk2ui-layout" }
hawk2ui-runtime = { version = "0.1.0", path = "../hawk2ui-runtime" }
# Drives the author's compiled entry script (boa) to build the editor scene.
# This crate only *calls* the script engine; `unsafe_code = "forbid"` stays.
hawk2ui-script = { version = "0.1.0", path = "../hawk2ui-script" }

[dev-dependencies]
hawk2ui-render = { version = "0.1.0", path = "../hawk2ui-render" }

# Test-only: the sealed `Params` trait can only be produced by `#[derive(Params)]`,
# whose generated code references `::truce::` paths, so the umbrella crate (not
# just `truce-derive`) is required to build a `PluginContext` for the gated
# native editor smoke. `default-features = false` keeps the format/SDK wrappers
# out. `x11rb` creates a real X11 parent window for that test.
[target.'cfg(target_os = "linux")'.dev-dependencies]
truce = { version = "0.49.14", default-features = false }
x11rb = "0.13.2"
