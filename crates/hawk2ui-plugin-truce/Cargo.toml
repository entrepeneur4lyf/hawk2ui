[package]
name = "hawk2ui-plugin-truce"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Truce audio-plugin framework binding for Hawk2UI: renders the Hawk2UI editor into a truce plugin through truce's Editor seam."

[lib]
name = "hawk2ui_plugin_truce"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
truce-core = "0.49.14"
truce-params = "0.49.14"
