[identity]
id = "com.hawk2ui.examples.plugin-basic"
name = "Hawk2UI Plugin Basic"
version = "0.1.0"

[source]
entry = "src/editor.ts"

[capabilities]
keys = ["plugin-editor", "sealed-artifacts"]

[[targets]]
kind = "plugin"
name = "vst3-clap"

[plugin]
id = "com.hawk2ui.examples.plugin-basic"
name = "Hawk2UI Plugin Basic"

[editor]
width = 960
height = 540

[[parameters]]
id = "gain"
name = "Gain"
default = 0.5

[[parameters]]
id = "mix"
name = "Mix"
default = 1.0
