[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive dependency of deno_core 0.403.0. bincode 1.3.3 is unmaintained
    # but has no safe upgrade through the accepted deno_core release; deno_core is
    # tracked in release/dependency-policy.toml with a runtime upgrade gate.
    "RUSTSEC-2025-0141",
    # Transitive dependency of v8 149.2.0. paste is unmaintained but has no safe
    # upgrade through the accepted V8 binding release; v8 is tracked in
    # release/dependency-policy.toml with artifact compatibility checks.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # notify 8.x uses CC0 for its Rust source. Accepted for the native dev watcher.
    "CC0-1.0",
    # webpki-roots ships Mozilla trust-store data under the SPDX-listed CDLA permissive license.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
