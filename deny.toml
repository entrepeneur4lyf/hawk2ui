[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive dependency of boa_engine 0.21.1. The advisory is unmaintained,
    # not a known vulnerability, and Boa has no safe replacement path for this
    # dependency on the accepted release line.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # notify 8.x uses CC0 for its Rust source. Accepted for the native dev watcher.
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
