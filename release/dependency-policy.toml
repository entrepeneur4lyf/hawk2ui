[[dependencies]]
name = "deno_core"
source = "crates-io"
version = "0.403.0"
owner = "runtime"
risk = "Embedded JavaScript runtime core. Upgrades must preserve sealed module loading, op registration, event loop behavior, runtime interruption, source diagnostics, and absence of ambient Deno globals."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-js-runtime -- --nocapture && cargo clippy -p hawk2ui-js-runtime --all-targets -- -D warnings"

[[dependencies]]
name = "v8"
source = "crates-io"
version = "149.2.0"
owner = "runtime"
risk = "Native V8 binding and prebuilt artifact compatibility set. Upgrades must preserve verified archive/binding artifact checks and must not introduce a Hawk2UI V8 source-build fallback."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-js-runtime --test v8_artifacts -- --nocapture"

[[dependencies]]
name = "parley"
source = "crates-io"
version = "0.7.0"
owner = "text"
risk = "Accepted text layout engine release; upgrades must preserve shaping, bidi, wrapping, fallback, and high-DPI metrics."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-text && cargo test -p hawk2ui-layout hawk_text_measurer_uses_production_text_backend_metrics"

[[dependencies]]
name = "oxc_allocator"
source = "crates-io"
version = "0.133.0"
owner = "runtime"
risk = "Fast-moving compiler dependency family; upgrades must validate TypeScript transform diagnostics and emitted JavaScript semantics."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-script script_backend_compiles_typescript_with_interfaces_generics_and_assertions"

[[dependencies]]
name = "oxc_codegen"
source = "crates-io"
version = "0.133.0"
owner = "runtime"
risk = "Fast-moving compiler dependency family; must stay version-aligned with the other OXC crates."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-script script_backend_executes_javascript_and_typescript_modules"

[[dependencies]]
name = "oxc_parser"
source = "crates-io"
version = "0.133.0"
owner = "runtime"
risk = "Fast-moving parser dependency; upgrades must preserve supported TypeScript syntax and diagnostics."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-script"

[[dependencies]]
name = "oxc_semantic"
source = "crates-io"
version = "0.133.0"
owner = "runtime"
risk = "Fast-moving semantic analysis dependency; upgrades must validate transformed source behavior."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-script"

[[dependencies]]
name = "oxc_span"
source = "crates-io"
version = "0.133.0"
owner = "runtime"
risk = "Fast-moving source span dependency; upgrades must preserve diagnostic source mapping behavior."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-script"

[[dependencies]]
name = "oxc_transformer"
source = "crates-io"
version = "0.133.0"
owner = "runtime"
risk = "Fast-moving transformer dependency; upgrades must preserve TypeScript-to-JavaScript lowering."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-script"

[[dependencies]]
name = "lightningcss"
source = "crates-io"
version = "1.0.0-alpha.71"
owner = "style"
risk = "Alpha CSS parser; accepted only behind Hawk2UI typed style boundaries and exact subset tests."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-style"

[[dependencies]]
name = "taffy"
source = "crates-io"
version = "0.10.0"
owner = "layout"
risk = "Pre-1.0 layout engine; upgrades must preserve flex, absolute, text measurement, DPI, and plugin constraint behavior."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-layout"

[[dependencies]]
name = "skia-safe"
source = "crates-io"
version = "0.97.2"
owner = "render"
risk = "Native graphics binding with binary artifacts. Ganesh GPU needs the `gl` feature WITH skia-safe's default features on — that matches rust-skia's published prebuilt (`-gl-jpegd-jpege-pdf` on x86_64-linux); `default-features = false` plus `gl` is an unpublished combo and forces a from-source Skia compile. Upgrades must pass renderer, host software frame, and visual smoke tests."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-render-skia && cargo test -p hawk2ui-host-winit"

[[dependencies]]
name = "notify"
source = "crates-io"
version = "8.2.0"
owner = "developer-experience"
risk = "Native filesystem event backend for hawk2ui dev; upgrades must preserve debounced project-file change detection and fallback-safe dev reload classification."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-cli dev_loop::tests && cargo test -p hawk2ui-cli workspace_dev_watches_manifest_declared_sources_and_assets"

[[dependencies]]
name = "clap-sys"
source = "crates-io"
version = "0.5.0"
owner = "plugin"
risk = "Low-level CLAP ABI bindings; upgrades must preserve generated CLAP entry metadata, factory IDs, versioning, and package materialization."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-plugin-adapters plugin_adapters_build_clap_entry_plan_from_clap_sys_contract && cargo test -p hawk2ui-plugin-adapters plugin_adapters_materialize_package_metadata_outputs"

[[dependencies]]
name = "ed25519-dalek"
source = "crates-io"
version = "2.2.0"
owner = "security"
risk = "Release artifact signature verification primitive; upgrades must preserve trusted-key verification and invalid-signature rejection."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-build sealed_artifact && cargo test -p hawk2ui-security-model package_trust"

[[dependencies]]
name = "truce"
source = "crates-io"
version = "0.56.0"
owner = "plugin"
risk = "Umbrella crate for the truce audio-plugin framework used by fixture exports and generated parameter-source compile tests. Upgrades must preserve truce::plugin!, PluginLogic, derive macro paths, parameter metadata, sample-accurate automation behavior, and editor composition."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-plugin-truce-fixture && cargo test -p hawk2ui-build"

[[dependencies]]
name = "truce-core"
source = "crates-io"
version = "0.56.0"
owner = "plugin"
risk = "Core types for the truce audio-plugin framework (the Editor seam, PluginContext, EditorBridge, RawWindowHandle); Hawk2UI's multi-format plugin backend is built on truce. Upgrades must preserve the Editor trait surface, parent-window parenting, and EditorBridge parameter/transport routing."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-plugin-truce"

[[dependencies]]
name = "truce-params"
source = "crates-io"
version = "0.56.0"
owner = "plugin"
risk = "Parameter system for the truce framework (the Params trait backing PluginContext<P>). Upgrades must preserve normalized/plain parameter reads and the object-safety the Editor seam relies on."
release_blocker = false
upgrade_gate = "cargo test -p hawk2ui-plugin-truce"
